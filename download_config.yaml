# Market Data Download Configuration
# Defines tickers, historical ranges, storage locations, and persistence settings

download:
  # Output format: parquet (requires pyarrow) or csv
  format: "csv"

  # Save downloaded data to files before persisting to DB
  save_files: true

  # File storage location with placeholders:
  # {ticker} = AAPL, MSFT, etc
  # {timeframe} = 1min, 5min, hourly, daily
  # {start_date} = 20260101, 20240101, etc
  file_path_template: "~/.tradingagents/data_downloads/{ticker}/{timeframe}/data_{start_date}.{format}"

  # Compression for parquet files: snappy, gzip, brotli, none
  compression: "snappy"

# Tickers to download
tickers:
