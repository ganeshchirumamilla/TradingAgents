    enabled: false
  GOOGL:
    name: "Alphabet"
    enabled: false
  TSLA:
    name: "Tesla"
    enabled: false
  AMD:
    name: "AMD"
    enabled: false
  AVGO:
    name: "Broadcom"
    enabled: false
  JPM:
    name: "JPMorgan"
    enabled: false
  GS:
    name: "Goldman Sachs"
    enabled: false
  SPY:
    name: "S&P 500 ETF"
    enabled: false
  QQQ:
    name: "Nasdaq ETF"
    enabled: false
